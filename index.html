<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Happy Birthday Bestie! 🎂✨</title>
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #ffd6e8, #ffecf7);
      text-align: center;
      padding: 50px;
      color: #444;
    }

    h1 {
      font-size: 3rem;
      color: #ff5fa2;
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
      100% { transform: translateY(0); }
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      width: 70%;
      margin: auto;
      animation: fade 2s ease;
    }

    @keyframes fade {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    button {
      background: #ff5fa2;
      border: none;
      padding: 12px 20px;
      border-radius: 30px;
      color: white;
      cursor: pointer;
      font-size: 1rem;
      margin-top: 15px;
      transition: 0.3s;
    }
    button:hover {
      background: #ff2f85;
    }
  </style>
</head>

<body>

  <h1>🎉 Happy Birthday Bestie! 🎉</h1>

  <div class="card">
    <p>Dear bestie,</p>
    <p>You’re the brightest, funniest, kindest person ever.  
       I made this little website just for you — hope it makes you smile 💗</p>

    <button onclick="showMessage()">Click me 🎀</button>
    <p id="secret" style="display:none; margin-top:15px; font-size:1.2rem;">
      🌸 You're my favorite human — enjoy your day!! 🌸
    </p>
  </div>

  <script>
    function showMessage() {
      document.getElementById('secret').style.display = 'block';
    }
  </script>

</body>
</html>
